unit = "bt475"
prefix = "BT475"
title = "Brooktree Bt475 and Bt477 RAMDAC: datasheet port map only, no Express use found"
doc = "The Bt475 and Bt477 triple RAMDACs are described in the published datasheet held in the repository but no shipped Indigo or Express binary reads or writes one, and none of the Express schematics held names one. This page records only the datasheet's control-input truth table so that a later finding can be graded against it; it is not a statement that any Express board carries the part. Grades: established means stated by the published datasheet as a fact about the part; whether the part is on an Express board is unknown. Prose in devices/bt475/README.md."
from = "Brooktree Bt475/Bt477 datasheet (docs/Brooktree_Bt475_477.pdf), Table 1"
public_from = ["Brooktree Bt475/Bt477 datasheet"]
name_source = "public"
name_cite = "Brooktree Bt475/Bt477 datasheet"

