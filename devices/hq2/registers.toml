unit = "hq2"
prefix = "HQ2"
title = "HQ2 command engine: FIFO window, microstore and host registers"
doc = """Host-visible window of the HQ2 command engine in the Express graphics slot (physical 0x1f000000 on the Indigo): the FIFO window, the microstore load window and the register page with the finish-flag clear at the finish3 register. Provenance tags in item text: [public] published document or public driver, [binary] shipped IRIX, PROM or diagnostic-program binary (a software expectation, with the routine named), [vendor-derived] upstream headers (none supports any fact here). Register names marked ide are the names the shipped diagnostic program prints; names marked NetBSD are the public driver's. Grades: established means read in full in a shipped binary or stated by a published document; inferred means a reasoned reading; unknown means nothing shipped settles it. Nothing was read on a board and no reset value is stated by any source, so none is given except where noted. Prose in devices/hq2/README.md."""
from = "IRIX IP20 kernel driver (gr2.a), IP20 PROMs 4.0.5D and 4.0.5G, IRIX diagnostic program ide.IP20, X server driver gr2.so"
public_from = ["NetBSD sgimips grtworeg.h and grtwo.c", "Elan Graphics Technical Report"]
name_source = "ours"

[constants]
FIFO_DEPTH_LIMIT = { value = 63, grade = "inferred", doc = "Largest fill level the kernel ever programs into the FIFO_FULL threshold (it clamps level plus one to 63). [binary] Gr2FIFOHandler. The status count field is seven bits wide, so the real depth is not shown by this." }
FIFO_FULL_INIT = { value = 40, grade = "established", doc = "Value both PROMs and the kernel write to FIFO_FULL at initialisation; the kernel writes it again when it waits for the FIFO to drain. [binary] _Gr2HQ2RegInit, Gr2FIFOPollLowater." }
FIFO_SPACE_CHECK = { value = 35, grade = "established", doc = "Fill level below which the kernel treats the FIFO as having room (it sleeps on the interrupt at 35 or more). [binary] Gr2FIFOPollLowater." }
PROBE_WORD = { value = 0xdeadbeef, grade = "established", doc = "Value every probe expects at the probe_word register. [binary] Gr2Probe, PROM probe." }

[registers.fifo_window]
offset = 0x40000
access = "w"
width = 32
count = 32768
grade = "established"
doc = """Graphics FIFO window, 128 KiB. A store is a command: bits 10:2 of the address select a microcode entry, bits 15:12 and bit 16 select an attribute shape, the value is the first operand. Further operands go to the data port, slot 0 or slot 479. [binary] pipeline page; every shipped program. The kernel's pixel-DMA path uses slot 0 as the data port while the full microcode runs, so slot 0 is accepted by it. qtest: a store at a slot raises the FIFO fill level by one word."""

[registers.ucode_store]
offset = 0x60000
access = "rw"
width = 32
count = 8192
grade = "established"
doc = """HQ2 microstore, one 32-bit word per address, address = word index from the window base. [binary] Gr2DownloadHQ2 writes each loaded word and reads it back unmasked. The 8192-word size is NetBSD's span [public]; the largest address the shipped image writes is not checked. qtest: a written word reads back."""

[registers.attr_jump]
offset = 0x6a000
access = "rw"
width = 32
count = 16
grade = "established"
doc = """Attribute jump table, 16 words. [binary] The loader writes 16 words from image offset 0xfc and reads them back (Gr2DownloadHQ2); the ide register menu writes entries by number 0 to 15 and reads the table. The table is indexed by bits 15:12 of the FIFO address: inferred from its size and from the GL core's address forms (pipeline page). qtest: each word reads back."""

[registers.status]
offset = 0x6a040
access = "r"
width = 32
grade = "established"
from = "ide.IP20 gr2_rdHQ2reg (prints every field, with its name); gr2.o Gr2FIFOHandler 0x2a0, Gr2FIFOPollLowater 0x158, _Gr2UcodeReady 0xb64; gr2_dma.o _Gr2MCDMAtrigger; PROM 4.0.5D 0xbfc0ecec and 4.0.5G probe"
doc = """Status word. The diagnostic program names it the HQ2 version register and prints the fields below; the kernel and PROMs read it by word load and use the fields marked. The ide field names are those it prints. Bits 2:0 are three finish flags set by microcode and cleared by host stores (finish_flag3 by the finish3 register, finish_flag2 by the fin2 register, finish_flag1 by the fin1 register). The fill count and overflow bit are the kernel's FIFO flow control. [binary] qtest: after a store at the fin2 register of 0 bit 1 reads 0; the count field equals the number of words queued and not consumed; version reads 0 on every board seen (gfxinfo prints HQ2 rev A, [public] Usenet postings)."""

[registers.status.fields]
finish_flag3 = { bits = [0, 0], grade = "established", doc = "ide finflag3. Set by microcode on a finish command; read by Gr2SetMonitor, Gr2PcxSwap, Gr2DestroyDDRN and the X server image paths; cleared (or restored) by a store to the finish3 register. [binary]" }
finish_flag2 = { bits = [1, 1], grade = "established", doc = "ide finflag2. The kernel's microcode-ready and DMA-done flag: _Gr2UcodeReady and both DMA triggers poll it; cleared by a store of 0 to the fin2 register. [binary]" }
finish_flag1 = { bits = [2, 2], grade = "established", doc = "ide finflag1. The diagnostic program's DMA-done flag (it prints hq_version_reg when it times out) and the 4.0.5G PROM's pixel-DMA completion flag; cleared by a store of 0 to the fin1 register. [binary]" }
dma_sync_src = { bits = [4, 3], grade = "established", doc = "ide dma_sync source: 0 vertical interrupt, 1 video sync, 2 clear, 3 set. A read-back of the DMASYNC register; the kernel stores 2 before every DMA and 0 at early init. [binary]" }
fifo_overflow = { bits = [5, 5], grade = "established", doc = "ide FIFO overflow. The kernel interrupt handler prints 'FIFO overflowed, data is destroyed - Reset graphics' when set and does nothing else. How it clears is unknown. [binary]" }
fifo_count = { bits = [12, 6], grade = "established", doc = "ide FIFO count. Words in the FIFO. The kernel compares it with 35, 36, 40, 41 and 63. [binary]" }
fifo_lowater = { bits = [13, 13], grade = "established", doc = "ide FIFO low water. Never read by IRIX. Its condition (against FIFO_EMPTY or FIFO_FULL) is unknown. [binary]" }
zero = { bits = [15, 14], grade = "established", doc = "ide zero. Printed as a field that reads zero. [binary]" }
ge_ctr = { bits = [19, 16], grade = "established", doc = "ide ge_ctr. Role unknown; four bits. [binary]" }
ge_ptr = { bits = [22, 20], grade = "established", doc = "ide ge_ptr. Role unknown; three bits, wide enough to count eight engines. [binary]" }
version = { bits = [31, 23], grade = "established", doc = "ide HQ2 version. Both PROMs store (word >> 23) as the HQ2 revision byte (the low eight bits of this field). Gfxinfo's 'HQ2 rev A' corresponds to value 0 (inferred: rev letters count from A). [binary][public]" }

[registers.numge]
offset = 0x6a044
access = "rw"
width = 32
grade = "established"
doc = """Number of geometry engines. [binary] The kernel and PROM write the probed count (bit 4 also set when the count is 8); ide writes it and checks it ('Wrong NUMGE, expected, actual'), so it reads back. NetBSD NUMGE [public]. qtest: reads back the written value."""

[registers.fin1]
offset = 0x6a048
access = "w"
width = 32
grade = "established"
doc = """Finish flag 1 (ide, NetBSD FIN1). A store sets the flag to the stored value; the diagnostic program writes 0 before each DMA test and 1 or 0 from its menu, the 4.0.5G PROM writes 0 before a pixel DMA. Whether bit 2 of the status follows the stored bit 0 is inferred. [binary]"""

[registers.fin2]
offset = 0x6a04c
access = "w"
width = 32
grade = "established"
doc = """Finish flag 2 (ide, NetBSD FIN2). The kernel writes 0 before every context-switch, microcode-start and DMA command and then polls status bit 1. [binary] Gr2PcxSwap, Gr2Start, Gr2DestroyDDRN, _Gr2CXSaveRestore; triggers."""

[registers.dmasync]
offset = 0x6a050
access = "rw"
width = 32
grade = "established"
doc = """DMA sync source select (ide DMA sync source, NetBSD DMASYNC): 0 vertical interrupt, 1 video sync, 2 clear, 3 set. The ide menu warns not to write it through the version register. The kernel writes 2 before every DMA and 0 in early init. Which value releases the MC's sync-gated transfer is inferred. [binary] The MC transfer mode used for board DMA sets the sync bit (devices/mc dma_mode bit 2)."""

[registers.fifo_full_timeout]
offset = 0x6a054
access = "rw"
width = 32
grade = "established"
doc = """FIFO full timeout. Written 100 by kernel and both PROMs. Unit and effect unknown. [binary] _Gr2HQ2RegInit."""

[registers.fifo_empty_timeout]
offset = 0x6a058
access = "rw"
width = 32
grade = "established"
doc = """FIFO empty timeout. Written 255 by the kernel and 10 by the 4.0.5D PROM. Unit and effect unknown. [binary]"""

[registers.fifo_full]
offset = 0x6a05c
access = "rw"
width = 32
grade = "established"
doc = """FIFO full threshold. Written 40 at init. The INT2 FIFO line (GIO line 0) is asserted while the fill count is at or above it, inferred from the PROM's wait-until-clear before every token and from the kernel handler raising it to level plus one to deassert the line. [binary] qtest: with the threshold at N the INT2 local-0 bit 0 equals (fifo_count >= N)."""

[registers.fifo_empty]
offset = 0x6a060
access = "rw"
width = 32
grade = "established"
doc = """FIFO empty (low water) threshold. Written 1. Effect unknown; status bit 13 is the likely consumer (inferred). [binary]"""

[registers.ge7_load_ucode]
offset = 0x6a064
access = "rw"
width = 32
grade = "established"
doc = """GE7 microcode load word (the fifth word of each record; see devices/ge7). Read back with mask 0x03dfffff. [binary] Gr2DownloadGE7; ide reads and writes it."""

[registers.gedma]
offset = 0x6a068
access = "rw"
width = 32
grade = "established"
doc = """GE DMA port. The MC's graphics DMA engine addresses this location as the GIO slave address of every board DMA (its physical address, 0x1f06a068 on the Indigo, is the transfer's GIO address); the kernel writes 0 to it twice after a DMA timeout. The ide menu reads and writes it. Whether a CPU word store pushes a word into the transfer (the kernel's non-MC fallback may do so) is inferred. [binary] _Gr2CXSaveRestore, Gr2MCPixDma and _Gr2MCDMAtrigger, ide gr2_rdHQ2reg."""

[registers.hq_gepc]
offset = 0x6a06c
access = "r"
width = 32
grade = "established"
doc = """HQ to GE7 program counter. The diagnostic program says it cannot be read ('hw bug'). The kernel probe nevertheless keeps bits 23:16 of a read as the 'HQ2 revision' byte, which is therefore not the revision (see the page). [binary] ide gr2_rdHQ2reg; _Gr2ProbeChipRev."""

[registers.gepc]
offset = 0x6a070
access = "w"
width = 32
grade = "established"
doc = """GE microstore address (ide: pc used for loading GE7 microcode, NetBSD GEPC). Written with each record's address by the loaders and with 0 by Gr2TpSetup and the PROM before the unstall. [binary]"""

[registers.intr]
offset = 0x6a074
access = "rw"
width = 32
grade = "inferred"
doc = """Interrupt bit register. The diagnostic program calls it 'Intr bit (cleared by host)' and offers a write. No IRIX or PROM driver code touches it. Which interrupt it raises is unknown. [binary] ide only."""

[registers.unstall]
offset = 0x6a078
access = "w"
width = 32
grade = "established"
doc = """Unstall HQ and GE (ide), NetBSD UNSTALL. Written 0 after microcode load by Gr2TpSetup and the PROM; the diagnostic program has an 'unstall HQ2/GE7 and set pc to 0' command that writes it. The sense of the value (0 releases) is inferred from the order. [binary]"""

[registers.probe_word]
offset = 0x6a07c
access = "r"
width = 32
ro = 0xffffffff
reset = 0xdeadbeef
reset_grade = "inferred"
reset_from = "Gr2Probe and the PROM probe read this before any initialisation of the registers on this page, so the constant is not an initialisation result; no source states it as a reset value"
grade = "established"
doc = """Probe word, always 0xdeadbeef. ide prints it as MYSTERY ADDRESS. [binary] Gr2Probe, PROM probe. qtest: a word read returns 0xdeadbeef before and after the microcode load."""

[registers.refresh]
offset = 0x6a080
access = "rw"
width = 32
grade = "established"
doc = """Refresh register. Written 16 by the kernel and both PROMs; the diagnostic program writes it from its menu. Effect unknown. [binary]"""

[registers.fin3_netbsd]
offset = 0x6a100
access = "rw"
width = 32
grade = "unknown"
doc = """NetBSD names the fin3_netbsd offset FIN3. No shipped program touches it; the third finish flag is written at the finish3 register in every shipped program (see finish3). [public] Unknown."""

[registers.finish3]
offset = 0x6b000
access = "w"
width = 32
grade = "established"
doc = """Finish flag 3 write port (ide Finish Flag 3). The kernel and X server store 0 to clear status bit 0 before a command and poll the bit afterwards; Gr2PcxSwap restores the saved bit of the incoming context by storing it here (so a store of 1 sets the flag). [binary] Gr2PcxSwap, Gr2DestroyDDRN, Gr2SetMonitor; expReadImage, expDrawImage. qtest: store 0 clears status bit 0; store 1 sets it."""
