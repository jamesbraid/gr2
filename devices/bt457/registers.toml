unit = "bt457"
prefix = "BT457"
title = "Brooktree Bt457 RAMDAC as wired on the Express board (three chips, one per colour)"
doc = "Three single-colour 5:1 multiplexed RAMDACs behind the five XMAP5 chips: red, green and blue, each with its own four-port window. Offsets are within one chip's window; the red, green and blue windows are 0x20 bytes apart (addresses in the README). Each port is one byte at the first byte of a 4-byte stride, so a big-endian CPU addresses the most significant lane. The port numbers follow the datasheet's C1 and C0 inputs: the stride bit 2 is C0 and bit 3 is C1. Grades: established means stated by the published Bt457/Bt458 datasheet or read in full in the shipped Indigo driver or PROM; inferred means a reasoned reading; unknown means nothing settles it. [public] marks the datasheet, [binary] a shipped binary. The datasheet says the command, read-mask, blink-mask and test registers are not initialised at power-up; this page gives no reset values. Nothing was read on a board. Prose in devices/bt457/README.md."
from = "Indigo driver archive gr2.a: gr2_init.o _Gr2DacInit and Gr2BlankScreen, gr2_retrace.o Gr2SetGammaRamp; PROM 070-8116-004 (4.0.5D)"
public_from = ["Brooktree Bt457/Bt458 datasheet", "NetBSD sgimips grtworeg.h"]
name_source = "public"
name_cite = "Brooktree Bt457/Bt458 datasheet (ADDR, command register, read mask register, blink mask register)"

[constants]
ADDR_READ_MASK = { value = 4, grade = "established", doc = "Address register value that selects the read mask register at port ctrl. [public] datasheet Table 3." }
ADDR_BLINK_MASK = { value = 5, grade = "established", doc = "Selects the blink mask register. [public]" }
ADDR_COMMAND = { value = 6, grade = "established", doc = "Selects the command register. [public]" }
ADDR_TEST = { value = 7, grade = "established", doc = "Selects the control and test register. [public]" }
INIT_COMMAND = { value = 0xc1, grade = "established", doc = "Command register value written at init: 5:1 multiplexing, palette RAM in use, blink off, overlay 0 enabled, overlay 1 disabled. [binary] _Gr2DacInit and the PROM; decode from [public]." }
INIT_READ_MASK = { value = 0x00, grade = "established", doc = "Read mask written at init: all planes masked, so every pixel reads palette entry 0 and the screen is black until Gr2BlankScreen writes 0xff. [binary]" }
UNBLANK_READ_MASK = { value = 0xff, grade = "established", doc = "Read mask written to unblank. [binary] Gr2BlankScreen (second argument zero)." }
PALETTE_ENTRIES = { value = 256, grade = "established", doc = "Palette RAM entries; init writes the identity ramp (entry n holds n) to all three chips, and Gr2SetGammaRamp overwrites it from three 256-byte arrays. The address register wraps to 0 after entry 255. [binary] [public]" }
OVERLAY_ENTRIES = { value = 4, grade = "established", doc = "Overlay colour registers. Init writes 0, 1, 2, 3 into them. [binary]" }

[registers.addr]
offset = 0x00
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "gr2_init.o _Gr2DacInit, gr2_retrace.o Gr2SetGammaRamp"
doc = "Address register. Written before every register or palette access; after a palette or overlay access it advances (palette wraps to 0 after 255, overlay goes to 4 after overlay 3, control registers do not advance it). [public] [binary] A qtest can discriminate: write 255 to addr, write two bytes to palette, check the address wrapped to 0 then 1."

[registers.palette]
offset = 0x04
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "gr2_init.o _Gr2DacInit (256 byte writes), gr2_retrace.o Gr2SetGammaRamp"
doc = "Colour palette RAM data. The three chips are addressed separately, so the board uses the datasheet's normal mode: one byte write stores one colour component of the addressed entry and the address advances. [public] [binary]"

[registers.ctrl]
offset = 0x08
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "gr2_init.o _Gr2DacInit and Gr2BlankScreen"
doc = "Control register data: the register picked by addr (read mask, blink mask, command, test) is read or written here and addr does not advance. [public] [binary] Gr2BlankScreen writes the read mask this way, ctrl 0 to blank and 255 to unblank, after addr 4, in all three chips."

[registers.overlay]
offset = 0x0c
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "gr2_init.o _Gr2DacInit"
doc = "Overlay colour data, entries 0 to 3 selected by addr. Init writes four bytes 0 to 3 after setting addr to 0. [public] [binary]"

[words.COMMAND]
width = 8
grade = "established"
doc = "Command register fields, from the datasheet. The board writes 0xc1."
[words.COMMAND.fields]
overlay0_display = { bits = [0, 0], grade = "established", doc = "[public] 1 enables overlay plane 0 input." }
overlay1_display = { bits = [1, 1], grade = "established", doc = "[public] 1 enables overlay plane 1 input." }
overlay0_blink = { bits = [2, 2], grade = "established", doc = "[public]" }
overlay1_blink = { bits = [3, 3], grade = "established", doc = "[public]" }
blink_rate = { bits = [5, 4], grade = "established", doc = "[public] 16/48, 16/16, 32/32 or 64/64 retrace intervals." }
ram_enable = { bits = [6, 6], grade = "established", doc = "[public] 1 uses palette RAM when the overlay select bits are 00; 0 uses overlay colour 0." }
mux_select = { bits = [7, 7], grade = "established", doc = "[public] 1 selects 5:1 multiplexing, matching the five XMAP5 chips." }
