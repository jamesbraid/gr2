unit = "ge7"
prefix = "GE7"
title = "GE7 geometry engines: host window and microcode load registers"
doc = """Host-visible window of the GE7 geometry engines in the Express graphics slot. Provenance tags in item text: [public] published document or public driver, [binary] shipped IRIX or PROM binary (a software expectation), [vendor-derived] upstream headers (none used here). Routine names, addresses and cross-references are in the unit README."""
from = "IRIX IP20 kernel driver, IP20 PROM 4.0.5D, IRIX diagnostic program"
public_from = ["NetBSD sgimips public driver", "Elan Graphics Technical Report"]
name_source = "ours"

[registers.shared_ram]
offset = 0x0
access = "rw"
width = 32
count = 32767
grade = "established"
doc = """Shared data RAM below the ready flag. [binary] The microcode loader copies the constants block into its first words and reads them back; its error text calls it shared RAM. [public] NetBSD's memory map names it shared data RAM. qtest: a word written reads back."""

[registers.ucode_ready]
offset = 0x1fffc
access = "rw"
width = 32
grade = "established"
doc = """Last word of the shared RAM, used as a flag. [binary] The driver stores 1 after the built-in console microcode loads and 0 when a load fails; the consumer is unread, so the meaning "microcode ready" is inferred. qtest: reads back what was written."""

[registers.slot0_ram]
offset = 0x68000
access = "rw"
width = 32
count = 248
grade = "inferred"
doc = """Engine 0 storage below the microcode window. [binary] The engine probe takes slot 0 as present and tests only slots 1 to 7, so ordinary storage here is inferred from the other slots. qtest: the first and the last tested offsets read back a written word."""

[registers.ucode_d0]
offset = 0x683e0
access = "rw"
width = 32
grade = "established"
doc = """Microword column 0, lowest. [binary] The loader writes record bytes 20 to 23 here and reads them back unmasked. One window serving every populated engine (broadcast) is inferred. qtest: a full 32-bit value reads back."""

[registers.ucode_d1]
offset = 0x683e4
access = "rw"
width = 32
grade = "established"
doc = """Microword column 1. [binary] The loader writes record bytes 16 to 19 here and reads them back unmasked. qtest: a full 32-bit value reads back."""

[registers.ucode_d2]
offset = 0x683e8
access = "rw"
width = 32
grade = "established"
doc = """Microword column 2. [binary] The loader writes record bytes 12 to 15 here and reads them back unmasked. qtest: a full 32-bit value reads back."""

[registers.ucode_d3]
offset = 0x683ec
access = "rw"
width = 32
grade = "established"
doc = """Microword column 3. [binary] The loader writes record bytes 8 to 11 here; the verify masks both sides to seven bits, so only seven bits are stored. qtest: writing all ones reads back with the low seven bits set."""
[registers.ucode_d3.fields]
stored = { bits = [6, 0], grade = "established" }

[registers.revision]
offset = 0x683f4
access = "rw"
width = 32
grade = "established"
doc = """GE7 revision. [binary] The kernel driver and the PROM probe write zero, read the word back and keep bits 7:5 of the low byte. [public] NetBSD reads another offset in slot 0 and keeps bits 7:4; no shipped binary read touches that offset, so this register is taken as the revision. That the three bits are a revision number is inferred. qtest: after a write of zero, bits 7:5 read as the configured revision."""
[registers.revision.fields]
rev = { bits = [7, 5], grade = "inferred" }

[registers.slot_ram]
offset = 0x68400
access = "rw"
width = 32
count = 1792
grade = "established"
doc = """Engine slots 1 to 7, 1 KiB each. [binary] The engine probe writes five words per slot at slot offsets 0x0, 0x7c, 0xfc, 0x17c and 0x1fc and reads them back; each slot that returns all five sets the count to its index plus one. An absent slot's reply (bus error or data), storage beyond the last probed offset, and whether the load window and revision register repeat in these slots are unknown. qtest: slot n returns the five written words for n below the engine count and not above."""
